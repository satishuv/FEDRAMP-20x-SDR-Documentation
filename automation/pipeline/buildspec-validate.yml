# CI gate for the SDR repository. Three checks, in order:
#   1. Regenerate every deliverable from the record store and pinned dataset.
#   2. Refuse hand-edited generated files: after regeneration the working
#      tree must be clean (deterministic pipeline makes this possible).
#      Docx files are excluded because their zip container embeds
#      file-entry timestamps; their content is covered by the validator.
#   3. validate_sdr.py must pass with 0 hard failures (schema, coverage,
#      test minimums, hygiene, content fidelity against the dataset).
#   4. sdrscan reports assessment readiness per rule and per indicator. It
#      does not gate, because a template legitimately has open gaps; its
#      reports ride along in the artifact so a reviewer sees exactly what is
#      still missing before approving publication.
# The deliverables package is emitted as the pipeline artifact and is
# published to S3 only after human approval.
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet -r requirements-ci.txt
  build:
    commands:
      - python sdr.py build
      - git diff --exit-code -- . ':(exclude)*.docx' || { echo "FAIL. Generated outputs differ from committed files. Never edit generated files by hand; edit sdr/records/records-store.json and regenerate."; exit 1; }
      - python sdr.py validate --no-tests
      - python automation/sdrscan/sdrscan.py --write-catalog
      - git diff --exit-code -- automation/sdrscan/check-catalog.json || { echo "FAIL. check-catalog.json is out of date with checks.py. Run: python automation/sdrscan/sdrscan.py --write-catalog"; exit 1; }
      - python automation/sdrscan/sdrscan.py --output-formats json,csv,html,txt --only-fails --no-colour --ignore-exit-code-3
  post_build:
    commands:
      - echo "Validation passed. Readiness scan attached. Packaging deliverables."

artifacts:
  base-directory: .
  files:
    # The complete Certification Package: the SDR (JSON + human-readable), every
    # generated package artifact (CPO, OCR, SCG, and the event-driven incident,
    # change, and vulnerability artifacts), the deterministic release manifest,
    # the validation reports, and the rev5->20x crosswalk. This is the full set a
    # reviewer approves and that is published to S3 after human approval.
    - sdr/json/**/*
    - sdr/human-readable/**/*
    - package/**/*
    - artifacts/release-manifest.json
    - validation/reports/**/*
    - traceability/rev5-to-20x-crosswalk.*
