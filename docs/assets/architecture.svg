<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 860" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
    <marker id="arrowOpt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e6f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="860" fill="#0d1117"/>

  <!-- title -->
  <text x="570" y="42" fill="#f0f6fc" font-size="23" text-anchor="middle" font-weight="700">FedRAMP 20x Certification Package, built from facts</text>
  <text x="570" y="66" fill="#8b949e" font-size="13.5" text-anchor="middle">You maintain one file of facts. Everything else is generated, schema-validated, and continuously checked.</text>

  <!-- ===== solid forward edges ===== -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <!-- facts -> builder -->
    <path d="M280,196 C280,236 470,214 470,250" marker-end="url(#arrow)"/>
    <!-- rulebook -> builder -->
    <path d="M800,196 C800,236 610,214 610,250" marker-end="url(#arrow)"/>
    <!-- builder -> package -->
    <path d="M540,336 L540,384" marker-end="url(#arrow)"/>
    <!-- package -> checkers -->
    <path d="M470,592 C470,628 350,616 350,652" marker-end="url(#arrow)"/>
    <path d="M610,592 C610,628 730,616 730,652" marker-end="url(#arrow)"/>
  </g>

  <!-- optional evidence -> builder (green, dashed = optional) -->
  <path d="M210,300 C330,300 360,282 388,282" fill="none" stroke="#2f9e6f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowOpt)"/>

  <!-- daily drift check -> rulebook (blue dotted), clean elbow into the right edge -->
  <path d="M955,238 C935,238 930,200 922,182" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrow)"/>

  <!-- feedback loop: checkers -> facts, down the left margin -->
  <path d="M220,688 C70,688 70,150 168,140" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowLoop)"/>
  <path d="M220,688 L246,688" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- loop label -->
  <g transform="translate(92,410)">
    <rect x="-64" y="-30" width="150" height="64" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.2"/>
    <text x="11" y="-8" fill="#e3b341" font-size="14" text-anchor="middle" font-weight="700">the loop</text>
    <text x="11" y="11" fill="#c9d1d9" font-size="11.5" text-anchor="middle">the checkers point</text>
    <text x="11" y="27" fill="#c9d1d9" font-size="11.5" text-anchor="middle">you to what to fix</text>
  </g>

  <!-- ===== inputs ===== -->
  <!-- your facts -->
  <g>
    <rect x="150" y="120" width="260" height="76" rx="10" fill="#3d2e00" stroke="#d29922" stroke-width="2"/>
    <text x="280" y="148" fill="#f0d68a" font-size="17" text-anchor="middle" font-weight="700">Your system's facts</text>
    <text x="280" y="167" fill="#e6d9b0" font-size="12" text-anchor="middle">what you claim, and the evidence</text>
    <text x="280" y="185" fill="#b99a4d" font-size="11" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">records-store.json  (you edit this)</text>
  </g>
  <!-- rulebook -->
  <g>
    <rect x="670" y="120" width="260" height="76" rx="10" fill="#0d2847" stroke="#3b82f6" stroke-width="2"/>
    <text x="800" y="148" fill="#a9cbf5" font-size="17" text-anchor="middle" font-weight="700">The official rulebook</text>
    <text x="800" y="167" fill="#cbe0f7" font-size="12" text-anchor="middle">FedRAMP 2026 rules and JSON schemas</text>
    <text x="800" y="185" fill="#6f9fd8" font-size="11" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">CR26 dataset  (pinned + hash-locked)</text>
  </g>

  <!-- optional evidence sources (left, green) -->
  <g>
    <rect x="30" y="256" width="180" height="88" rx="10" fill="#0f2e1f" stroke="#2f9e6f" stroke-width="1.8"/>
    <text x="120" y="280" fill="#7ee2b8" font-size="13" text-anchor="middle" font-weight="700">Optional evidence</text>
    <text x="120" y="298" fill="#a7e3c8" font-size="10.5" text-anchor="middle">opt-in, off by default</text>
    <text x="120" y="316" fill="#8fd3b3" font-size="10" text-anchor="middle">AWS collectors</text>
    <text x="120" y="331" fill="#8fd3b3" font-size="10" text-anchor="middle">CrowdStrike Falcon, Wiz</text>
  </g>

  <!-- daily drift check (right margin, below rulebook level, blue) -->
  <g>
    <rect x="955" y="210" width="160" height="60" rx="9" fill="#0d1f3a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="1035" y="234" fill="#a9cbf5" font-size="12" text-anchor="middle" font-weight="700">Daily drift check</text>
    <text x="1035" y="252" fill="#8fb4e8" font-size="10" text-anchor="middle">alerts if upstream moves</text>
  </g>

  <!-- builder -->
  <g>
    <rect x="410" y="260" width="260" height="76" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <text x="540" y="288" fill="#e6edf3" font-size="17" text-anchor="middle" font-weight="700">The builder</text>
    <text x="540" y="307" fill="#c9d1d9" font-size="12" text-anchor="middle">merges your facts with the rules</text>
    <text x="540" y="325" fill="#9aa4ad" font-size="11" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">python sdr.py all  (one command)</text>
  </g>

  <!-- ===== the package (grouped) ===== -->
  <g>
    <rect x="360" y="384" width="360" height="208" rx="12" fill="#0f2e1a" stroke="#22c55e" stroke-width="2"/>
    <text x="540" y="412" fill="#9ae6b4" font-size="17" text-anchor="middle" font-weight="700">The Certification Package</text>
    <text x="540" y="431" fill="#63b57e" font-size="11" text-anchor="middle">every JSON validated against its official FedRAMP schema</text>

    <!-- artifact chips -->
    <g font-size="11.5" text-anchor="middle">
      <rect x="384" y="446" width="150" height="30" rx="6" fill="#123524" stroke="#2f9e6f"/>
      <text x="459" y="465" fill="#c3ecd0">Security Decision Record</text>
      <rect x="546" y="446" width="150" height="30" rx="6" fill="#123524" stroke="#2f9e6f"/>
      <text x="621" y="465" fill="#c3ecd0">Package Overview (CPO)</text>

      <rect x="384" y="484" width="150" height="30" rx="6" fill="#123524" stroke="#2f9e6f"/>
      <text x="459" y="503" fill="#c3ecd0">Ongoing Report (OCR)</text>
      <rect x="546" y="484" width="150" height="30" rx="6" fill="#123524" stroke="#2f9e6f"/>
      <text x="621" y="503" fill="#c3ecd0">Secure Config Guide</text>

      <rect x="384" y="522" width="312" height="30" rx="6" fill="#123524" stroke="#2f9e6f"/>
      <text x="540" y="541" fill="#c3ecd0">Event artifacts: incident, change, vulnerability (VDR/VER)</text>
    </g>
    <text x="540" y="574" fill="#63b57e" font-size="10.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">plain text + Word + OSCAL export alongside the JSON</text>
  </g>

  <!-- ===== checkers ===== -->
  <text x="540" y="632" fill="#6e7681" font-size="12.5" text-anchor="middle" font-weight="600">two automatic checkers</text>

  <!-- fact-checker -->
  <g>
    <rect x="210" y="652" width="280" height="86" rx="10" fill="#3d0a24" stroke="#ec4899" stroke-width="2"/>
    <text x="350" y="680" fill="#f9a8d4" font-size="16" text-anchor="middle" font-weight="700">The fact-checker</text>
    <text x="350" y="700" fill="#f3c2da" font-size="12" text-anchor="middle">fails the build if a claim does not</text>
    <text x="350" y="716" fill="#f3c2da" font-size="12" text-anchor="middle">match the rulebook or its schema</text>
    <text x="350" y="732" fill="#c78ba8" font-size="10" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">validate_sdr.py + validate_package.py</text>
  </g>
  <!-- readiness scanner -->
  <g>
    <rect x="590" y="652" width="280" height="86" rx="10" fill="#2a1758" stroke="#8b5cf6" stroke-width="2"/>
    <text x="730" y="680" fill="#c4b5fd" font-size="16" text-anchor="middle" font-weight="700">The readiness scanner</text>
    <text x="730" y="700" fill="#d6ccf5" font-size="12" text-anchor="middle">scores how ready you are</text>
    <text x="730" y="716" fill="#d6ccf5" font-size="12" text-anchor="middle">and what is left to do</text>
    <text x="730" y="732" fill="#a898d0" font-size="10" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">sdrscan.py</text>
  </g>

  <!-- caption -->
  <text x="540" y="792" fill="#adbac7" font-size="14" text-anchor="middle" font-weight="600">Write facts once. The framework builds the package, validates every artifact, and tells you what to fix next.</text>
  <text x="540" y="814" fill="#6e7681" font-size="11.5" text-anchor="middle">A green build proves the documents are well-formed, never that the claims are true. A human owns every status.</text>
</svg>
