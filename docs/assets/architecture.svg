<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <!-- ===== solid forward edges ===== -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M260,124 C260,160 375,138 375,172" marker-end="url(#arrow)"/>
    <path d="M680,124 C680,160 465,138 465,172" marker-end="url(#arrow)"/>
    <path d="M420,244 L420,296" marker-end="url(#arrow)"/>
    <path d="M390,368 C390,402 270,392 270,426" marker-end="url(#arrow)"/>
    <path d="M450,368 C450,402 570,392 570,426" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== feedback loop: checkers -> your facts, routed down the left margin ===== -->
  <path d="M150,458 C60,458 60,96 128,92" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowLoop)"/>
  <path d="M150,458 L176,458" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- loop label -->
  <g transform="translate(72,272)">
    <rect x="-58" y="-26" width="150" height="58" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.2"/>
    <text x="16" y="-6" fill="#e3b341" font-size="14" text-anchor="middle" font-weight="700">the loop</text>
    <text x="16" y="12" fill="#c9d1d9" font-size="11.5" text-anchor="middle">the checkers point</text>
    <text x="16" y="27" fill="#c9d1d9" font-size="11.5" text-anchor="middle">you to what to fix</text>
  </g>

  <!-- ===== nodes ===== -->
  <!-- your facts -->
  <g>
    <rect x="130" y="52" width="260" height="72" rx="10" fill="#3d2e00" stroke="#d29922" stroke-width="2"/>
    <text x="260" y="78" fill="#f0d68a" font-size="17" text-anchor="middle" font-weight="700">Your system's facts</text>
    <text x="260" y="97" fill="#e6d9b0" font-size="12" text-anchor="middle">what you claim, and the evidence</text>
    <text x="260" y="114" fill="#b99a4d" font-size="11" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">records-store.json  (you edit this)</text>
  </g>
  <!-- rulebook -->
  <g>
    <rect x="550" y="52" width="260" height="72" rx="10" fill="#0d2847" stroke="#3b82f6" stroke-width="2"/>
    <text x="680" y="78" fill="#a9cbf5" font-size="17" text-anchor="middle" font-weight="700">The official rulebook</text>
    <text x="680" y="97" fill="#cbe0f7" font-size="12" text-anchor="middle">the government's 2026 requirements</text>
    <text x="680" y="114" fill="#6f9fd8" font-size="11" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">FedRAMP CR26 dataset  (pinned)</text>
  </g>
  <!-- builder -->
  <g>
    <rect x="290" y="172" width="260" height="72" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <text x="420" y="198" fill="#e6edf3" font-size="17" text-anchor="middle" font-weight="700">The builder</text>
    <text x="420" y="217" fill="#c9d1d9" font-size="12" text-anchor="middle">merges your facts with the rules</text>
    <text x="420" y="234" fill="#9aa4ad" font-size="11" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">python sdr.py all  (one command)</text>
  </g>
  <!-- report -->
  <g>
    <rect x="290" y="296" width="260" height="72" rx="10" fill="#0f2e1a" stroke="#22c55e" stroke-width="2"/>
    <text x="420" y="322" fill="#9ae6b4" font-size="17" text-anchor="middle" font-weight="700">The finished report</text>
    <text x="420" y="341" fill="#c3ecd0" font-size="12" text-anchor="middle">the SDR, in every format</text>
    <text x="420" y="358" fill="#63b57e" font-size="11" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">JSON / plain text / Word / crosswalk</text>
  </g>

  <!-- checkers band label -->
  <text x="770" y="452" fill="#6e7681" font-size="12.5" text-anchor="middle" font-weight="600">two automatic</text>
  <text x="770" y="470" fill="#6e7681" font-size="12.5" text-anchor="middle" font-weight="600">checkers</text>

  <!-- fact-checker -->
  <g>
    <rect x="140" y="426" width="260" height="72" rx="10" fill="#3d0a24" stroke="#ec4899" stroke-width="2"/>
    <text x="270" y="452" fill="#f9a8d4" font-size="17" text-anchor="middle" font-weight="700">The fact-checker</text>
    <text x="270" y="471" fill="#f3c2da" font-size="12" text-anchor="middle">fails the build if a claim</text>
    <text x="270" y="486" fill="#f3c2da" font-size="12" text-anchor="middle">does not match the rulebook</text>
  </g>
  <!-- to-do list -->
  <g>
    <rect x="440" y="426" width="260" height="72" rx="10" fill="#2a1758" stroke="#8b5cf6" stroke-width="2"/>
    <text x="570" y="452" fill="#c4b5fd" font-size="17" text-anchor="middle" font-weight="700">The to-do list</text>
    <text x="570" y="471" fill="#d6ccf5" font-size="12" text-anchor="middle">scores how ready you are</text>
    <text x="570" y="486" fill="#d6ccf5" font-size="12" text-anchor="middle">and what is left to do</text>
  </g>

  <!-- filename footnote for checkers -->
  <text x="270" y="516" fill="#8b6b7e" font-size="10.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">validate_sdr.py</text>
  <text x="570" y="516" fill="#7d6ba8" font-size="10.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">sdrscan.py</text>

  <!-- caption -->
  <text x="440" y="556" fill="#adbac7" font-size="13.5" text-anchor="middle" font-weight="600">You write facts about your system. The framework turns them into an official, self-checking report.</text>
</svg>
