# CI gate, GitHub Actions edition. Same three checks as the AWS CodeBuild
# buildspec (automation/pipeline/buildspec-validate.yml):
#   1. Regenerate every deliverable from the record store and pinned dataset.
#   2. Refuse hand-edited generated files (regenerate-then-diff; docx excluded
#      because its zip container embeds timestamps).
#   3. validate_sdr.py must pass with 0 hard failures.
# Actions are pinned to full commit SHAs for supply-chain integrity.
name: validate-sdr

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Security scan: run ASH (AWS Automated Security Helper) on every push and
  # pull request so any code or config change is scanned. ASH aggregates
  # Bandit, checkov, cdk-nag, detect-secrets, and more; scan scope and
  # suppressions live in .ash.yaml. This job fails the build on actionable
  # findings at or above the configured severity threshold.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Cache the pip download/build of ASH and its dependency tree, keyed to
      # the pinned ASH version. The first run populates it; later runs restore
      # in seconds instead of re-resolving checkov, cdk-nag, boto3, etc., which
      # is the bulk of this job's time. Bump the key when the ASH pin changes.
      - name: Cache ASH install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ash-pip-v3.0.0-py3.12-${{ runner.os }}
          restore-keys: |
            ash-pip-v3.0.0-py3.12-
            ash-pip-
      - name: Install ASH
        run: pip install --quiet "git+https://github.com/awslabs/automated-security-helper.git@v3.0.0" "pydantic>=2.11.3,<2.12"
      - name: Run ASH scan (local mode)
        run: ash scan --source-dir . --output-dir .ash/ash_output --mode local
      - name: Upload ASH reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ash-security-reports
          path: .ash/ash_output/reports/

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet jsonschema referencing python-docx boto3
      - name: Regenerate all deliverables
        run: |
          python validation/scripts/build_catalogs.py
          python validation/scripts/build_notes.py
          python validation/scripts/build_profiles.py
          python validation/scripts/build_collector_registry.py
          python validation/scripts/build_sdr.py
          python validation/scripts/build_docx.py
          python validation/scripts/build_crosswalk.py
      - name: Refuse hand-edited generated files
        run: |
          git diff --exit-code -- . ':(exclude)*.docx' || {
            echo "FAIL. Generated outputs differ from committed files."
            echo "Never edit generated files by hand; edit sdr/records/records-store.json and regenerate."
            exit 1
          }
      - name: Validate (schema, coverage, minimums, hygiene, content fidelity)
        run: python validation/scripts/validate_sdr.py
      - name: Run offline collector tests (no AWS account needed)
        run: python automation/collectors/test_collectors.py
      - name: Run offline collector scale + fault-injection tests (no AWS)
        run: python automation/collectors/test_collectors_scale.py
      - name: Run offline collector fixture-scale tests (AWS-shaped, no AWS)
        run: python automation/collectors/test_collectors_fixtures.py
      - name: Run offline multi-account fan-out tests (no AWS)
        run: python automation/collectors/test_multi_account.py
      - name: Run offline pre-fill tests (no AWS account needed)
        run: python automation/prefill/test_prefill.py
      - name: Run offline AI narrative-drafter boundary tests (no AWS, no model)
        run: python automation/ai/test_draft_narratives.py
      - name: Run offline AI finding-explainer tests (no AWS, no model)
        run: python automation/ai/test_explain_findings.py
      - name: Run offline AI evidence-rollup tests (no AWS, no model)
        run: python automation/ai/test_rollup_evidence.py
      - name: Run offline AI over-claim-guard tests (no AWS, no model)
        run: python automation/ai/test_review_overclaim.py
      - name: Run offline AI KSI-mapping-suggester tests (no AWS, no model)
        run: python automation/ai/test_suggest_ksi_mapping.py
      - name: Run offline metric-appender tests (no AWS account needed)
        run: python automation/metrics/test_append_metrics.py
      - name: Run offline longitudinal metric-history tests (no AWS)
        run: python automation/metrics/test_metric_history_longitudinal.py
      - name: Run offline Config custom-rule handler tests (no AWS, Bucket B)
        run: python automation/config-rules/test_evidence_existence_rule.py
      - name: Run offline Config-rule deploy-template generator tests (no AWS)
        run: python automation/config-rules/deploy/test_generate_templates.py
      - name: Run offline durable-store provisioner tests (no AWS)
        run: python automation/storage/test_provision_store.py
      - name: Run offline AI Bedrock-backend boundary tests (no AWS, no model)
        run: python automation/ai/test_bedrock_boundary.py
      - name: Run offline dataset-diff tests (no AWS)
        run: python validation/scripts/test_dataset_diff.py
      - name: Refuse a stale check catalog
        run: |
          python automation/sdrscan/sdrscan.py --write-catalog
          git diff --exit-code -- automation/sdrscan/check-catalog.json || {
            echo "FAIL. check-catalog.json is out of date with checks.py."
            echo "Run: python automation/sdrscan/sdrscan.py --write-catalog"
            exit 1
          }
      - name: Scan assessment readiness (reports, does not gate)
        run: |
          python automation/sdrscan/sdrscan.py --output-formats json,csv,html,txt \
            --only-fails --no-colour --ignore-exit-code-3
      - name: Upload validation and scan reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: validation-reports
          path: validation/reports/
