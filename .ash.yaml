# ASH (AWS Automated Security Helper) configuration for the SDR repo.
#
# The scan should cover real source (Python collectors, IaC templates), not
# generated outputs, caches, or synthetic test fixtures. The paths below are
# excluded because they are produced by the pipeline or tests and contain
# high-entropy strings (hashes, resource IDs) that detect-secrets flags as
# false-positive "secrets" -- they are not credentials. Real source stays in
# scope, so genuine findings (e.g. the IaC template) are still reported.
project_name: fedramp-20x-sdr
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: 'validation/reports/'
      reason: 'Generated scanner reports (regenerated on demand); high-entropy IDs are not secrets.'
    - path: '.pytest_cache/'
      reason: 'Pytest cache directory; not source.'
    - path: '.ash/'
      reason: 'ASH scan output directory; not source.'
    - path: 'automation/collectors/testdata/'
      reason: 'Synthetic AWS-shaped test fixtures generated from botocore models; no real secrets.'
    - path: 'automation/facts/'
      reason: 'Read-only telemetry facts store (git-ignored); derived from a live account, not secrets.'
    - path: 'sdr/records/records-store.prefilled.json'
      reason: 'Git-ignored prefill sidecar derived from account facts; not secrets.'
    - path: 'automation/ai/test_explain_findings.py'
      reason: 'Test-only file; detect-secrets matches a long snake_case test function name against its IBM-Cloud-IAM-Key heuristic. It is a Python identifier in a print statement, not a credential.'
  suppressions:
    - rule_id: 'SECRET-HEX-HIGH-ENTROPY-STRING'
      path: 'references/sources.lock.json'
      reason: 'The high-entropy hex strings are SHA-256 integrity hashes of public FedRAMP source files (the pinned CR26 dataset and schemas), recorded so the drift check and a human can verify the pins. They are published on purpose and are not credentials. Scoped to this file and this rule only, so any other secret type here is still gated.'
    - rule_id: 'CKV_AWS_26'
      path: 'automation/pipeline/sdr-pipeline.yaml'
      reason: 'SNS topic intentionally not KMS-encrypted at rest: EventBridge and CodePipeline cannot publish through the aws/sns managed key policy, which would silently break approval and failure notifications. SSL-in-transit is enforced via the topic policy. Documented inline as a checkov:skip; mirrored here so ASH honors it.'
    - rule_id: 'CKV_AWS_18'
      path: 'automation/pipeline/sdr-pipeline.yaml'
      reason: 'Access logging is intentionally not enabled on the LogBucket itself: a log-destination bucket cannot log to another log bucket without an infinite chain (standard S3 log-bucket exception). Documented inline as a checkov:skip; mirrored here so ASH honors it.'
    # The following suppress findings on the GENERATED Config-rule deploy
    # reference template (automation/config-rules/deploy/cloudformation.yaml and
    # its CDK equivalent). This is an illustrative reference artifact a provider
    # ADAPTS and HARDENS for their own account, not infrastructure this repo
    # deploys. The Lambda hardening choices below (VPC, concurrency, DLQ) are
    # deliberately provider-specific decisions, and the IAM findings are the
    # minimum the evidence-existence rule needs. Each is scoped to the deploy
    # template path only, so real IaC elsewhere is still gated.
    - rule_id: 'AwsSolutions-IAM4'
      path: 'automation/config-rules/deploy/cloudformation.yaml'
      reason: 'Uses the AWS-managed AWSLambdaBasicExecutionRole for CloudWatch Logs only. A managed logging policy is an acceptable default for a reference template; a provider may swap in a customer-managed policy when adapting it.'
    - rule_id: 'AwsSolutions-IAM5'
      path: 'automation/config-rules/deploy/cloudformation.yaml'
      reason: 'Two scoped wildcards: config:PutEvaluations has no resource-level ARN in IAM (must be *), and s3:GetObject is scoped to the evidence bucket path (bucket/*), which is the object-level grant the rule needs. No broader wildcard is present.'
    - rule_id: 'AwsSolutions-L1'
      path: 'automation/config-rules/deploy/cloudformation.yaml'
      reason: 'Reference template pins python3.12 (a current, supported runtime). Runtime currency is a provider maintenance decision when they adopt the template.'
    - rule_id: 'CKV_AWS_116'
      path: 'automation/config-rules/deploy/cloudformation.yaml'
      reason: 'No Lambda DLQ on the reference template: the function is a synchronous Config custom-rule evaluator (Config retries and records failures), so a DLQ adds no value here. A provider may add one when adapting.'
    - rule_id: 'CKV_AWS_115'
      path: 'automation/config-rules/deploy/cloudformation.yaml'
      reason: 'No reserved concurrency on the reference template: concurrency limits are an account-level capacity decision the provider makes for their own account, not a fixed property of the reference artifact.'
    - rule_id: 'CKV_AWS_117'
      path: 'automation/config-rules/deploy/cloudformation.yaml'
      reason: 'Lambda not VPC-attached in the reference template: it only calls the S3 and Config public endpoints and holds no VPC-resident dependency. Whether to run it in a VPC (with endpoints) is a provider network-design decision when adopting the template.'
    - rule_id: 'CKV_AWS_364'
      path: 'automation/config-rules/deploy/cloudformation.yaml'
      reason: 'Lambda timeout/config default on the reference template; the provider tunes runtime limits for their own account when adapting it.'
